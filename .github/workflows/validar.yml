name: validar-suplemento

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: python -m pip install -e '.[test]'
      - name: Ejecutar flujo reproducible completo
        run: python 04_reproduccion_python/reproducir_todo.py
      - name: Ejecutar pruebas
        run: pytest -q
      - name: Verificar que las salidas versionadas son reproducibles
        run: git diff --exit-code
