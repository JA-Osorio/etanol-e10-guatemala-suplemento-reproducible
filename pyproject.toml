[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e10-gt-suplemento"
version = "0.2.0"
description = "Reproducción del E5 histórico y corrección E10 para Guatemala"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "matplotlib==3.10.8",
  "plotly==6.5.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
e10-gt-reproducir = "e10_gt.cli:main"

[tool.setuptools]
package-dir = {"" = "04_reproduccion_python/src"}

[tool.setuptools.packages.find]
where = ["04_reproduccion_python/src"]

[tool.pytest.ini_options]
testpaths = ["07_verificacion/tests"]
